[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adversarial-agent-runtime"
version = "0.1.0"
description = "A small adversarial agent runtime with tracing, persistence, and evals."
authors = [{ name = "Rosh N Ravi" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=5.4",
]

[project.scripts]
agent = "agent.user:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
include = ["agent*", "evals*", "mockllm*"]

[tool.setuptools.package-data]
agent = ["config_agent.yaml"]
evals = ["input.yaml"]
mockllm = ["scenarios/*.yml"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["agent_fw"]

[tool.pytest.ini_options]
testpaths = ["evals"]
